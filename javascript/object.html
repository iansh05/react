<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="output"> </p>
    
    <script> 
        const student={
            name:"ansh",
            class:"b.tech",
            fee:100000
        }
        let result="";
        for(key in student){
            result+=key+" : "+student[key]+"<br>";
        }   
        document.getElementById("output").innerHTML=result;
        
    </script>
</body>
</html>
