<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Example</title>
</head>
<body>

<script>
    const student = {
        name: "Ayush",
        class: "BTech",
        fee: 10000
    };

    console.log(student);
    console.log(student.name);
    console.log(student.class);
    console.log(student.fee);
</script>

</body>
</html>
