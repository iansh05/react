<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Example</title>
</head>
<body>

<script>
    const student = {
        name: "Ayush",
        class: "BTech",
        fee: 10000
    };

    const {name,class:studentClass,fee} = student;
    console.log(name);
    console.log(studentClass);
    console.log(fee);
</script>

</body>
</html>
